<svg viewBox="0 0 1200 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">What each tier needs</title>
<desc id="desc">Tier 0 needs logs and traceability, with internal review. Tier 1 needs explanations and override logs, with agency-level oversight. Tier 2 needs binding safeguards, delegation tokens and an audit bundle, with cross-agency reports. Tier 3 needs a person to confirm, formal appeals and an independent audit, with review by the ecosystem governor.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/></marker>
  <marker id="arrowMuted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7a8399"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="552" fill="#f5f5f5"/>
