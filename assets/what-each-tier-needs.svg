<text x="174.0" y="150.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">minimal risk</text>
<line x1="174" y1="168" x2="174" y2="196" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
