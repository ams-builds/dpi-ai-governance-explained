<svg viewBox="0 0 1200 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">From score to tier</title>
<desc id="desc">Multiply likelihood (1 to 5) by impact (1 to 5) to get a priority score. A score of 0 to 11 is Tier 0, 12 to 15 is Tier 1, 16 to 19 is Tier 2, and 20 or more is Tier 3. A score of exactly 12 is Tier 1, but if an input is in doubt, use Tier 2 until you resolve it.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/></marker>
  <marker id="arrowMuted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7a8399"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="512" fill="#f5f5f5"/>
<text x="40" y="52" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" fill="#2d3142">From score to tier</text>
<text x="40" y="72" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">TWO NUMBERS GIVE ONE SCORE. THE SCORE GIVES THE TIER.</text>
<rect x="40" y="112" width="150" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="115.0" y="138.92" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Likelihood</text>
<text x="115.0" y="152.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">1 to 5</text>
<text x="215" y="148" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#4f5d75">×</text>
<rect x="240" y="112" width="150" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="315.0" y="138.92" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Impact</text>
<text x="315.0" y="152.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">1 to 5</text>
<text x="415" y="148" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#4f5d75">=</text>
<rect x="440" y="112" width="150" height="60" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="515.0" y="138.92" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Priority score</text>
<text x="515.0" y="152.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">1 to 25</text>
<rect x="640" y="112" width="520" height="60" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="900.0" y="138.92" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Example from the source</text>
<text x="900.0" y="152.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">unclear legal authority for an agent: 4 × 5 = 20, so Tier 3</text>
<line x1="515" y1="172" x2="515" y2="238" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="40" y1="244" x2="1156" y2="244" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<text x="1160" y="232" text-anchor="end" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" letter-spacing="0.06em" fill="#7a8399">higher score, higher tier</text>
<rect x="40" y="262" width="268" height="70" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="174.0" y="287.92" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Tier 0</text>
<text x="174.0" y="301.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">score 0 to 11</text>
<text x="174.0" y="313.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">no consequence: log only</text>
<rect x="324" y="262" width="268" height="70" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="458.0" y="287.92" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Tier 1</text>
<text x="458.0" y="301.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">score 12 to 15</text>
<text x="458.0" y="313.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">advice, a person oversees</text>
<rect x="608" y="262" width="268" height="70" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="742.0" y="287.92" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Tier 2</text>
<text x="742.0" y="301.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">score 16 to 19</text>
<text x="742.0" y="313.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">automation with conditions</text>
<rect x="892" y="262" width="268" height="70" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="1026.0" y="287.92" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Tier 3</text>
<text x="1026.0" y="301.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">score 20 or more</text>
<text x="1026.0" y="313.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">high-impact decision</text>
<rect x="40" y="356" width="1120" height="52" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="600.0" y="378.92" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Score of exactly 12</text>
<text x="600.0" y="392.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">Tier 1 by default. If an input is in doubt, unstable, or incomplete, use Tier 2 until you resolve it.</text>
<line x1="40" y1="448" x2="1160" y2="448" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="40" y="480" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">KEY</text>
<rect x="120" y="470" width="22" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="152" y="481" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">the number that sets the tier</text>
<rect x="640" y="470" width="22" height="14" rx="3" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="672" y="481" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">an example or a special rule</text>
</svg>
