<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">How the kit works, at a glance</title>
<desc id="desc">Six steps: you describe your AI app, your AI agent lists the risks and scores each one, you confirm the risk tier, the agent drafts the controls that the tier needs, and you keep the evidence. After an incident or a big change, you score again.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/></marker>
  <marker id="arrowMuted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7a8399"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="400" fill="#f5f5f5"/>
<text x="50" y="52" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" fill="#2d3142">How the kit works, at a glance</text>
<text x="50" y="72" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">FIND THE RISK. GET THE CONTROLS. KEEP THE PROOF.</text>
<rect x="50" y="112" width="150" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="56" y="118" width="29" height="16" rx="4" fill="#ececec"/>
<text x="70.5" y="130" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="125.0" y="146.92" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Your AI app</text>
<text x="125.0" y="160.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">what it decides</text>
<line x1="200" y1="150" x2="236" y2="150" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="240" y="112" width="150" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="246" y="118" width="24" height="16" rx="4" fill="#ececec"/>
<text x="258.0" y="130" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">AI</text>
<text x="315.0" y="146.92" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">List risks</text>
<text x="315.0" y="160.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">what can go wrong</text>
<line x1="390" y1="150" x2="426" y2="150" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="430" y="112" width="150" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="436" y="118" width="24" height="16" rx="4" fill="#ececec"/>
<text x="448.0" y="130" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">AI</text>
<text x="505.0" y="146.92" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Score each</text>
<text x="505.0" y="160.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">likelihood × impact</text>
<line x1="580" y1="150" x2="616" y2="150" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="620" y="112" width="150" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="626" y="118" width="29" height="16" rx="4" fill="#ececec"/>
<text x="640.5" y="130" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="695.0" y="146.92" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Find the tier</text>
<text x="695.0" y="160.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">Tier 0 to Tier 3</text>
<line x1="770" y1="150" x2="806" y2="150" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="810" y="112" width="150" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="816" y="118" width="24" height="16" rx="4" fill="#ececec"/>
<text x="828.0" y="130" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">AI</text>
<text x="885.0" y="146.92" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Add controls</text>
<text x="885.0" y="160.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">what the tier needs</text>
<line x1="960" y1="150" x2="996" y2="150" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="1000" y="112" width="150" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="1006" y="118" width="29" height="16" rx="4" fill="#ececec"/>
<text x="1020.5" y="130" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="1075.0" y="146.92" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Keep evidence</text>
<text x="1075.0" y="160.92" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">proof for review</text>
<path d="M1075,188 C1075,278 315,278 315,192" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
<text x="695" y="274" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" letter-spacing="0.06em" fill="#7a8399">after an incident or a big change: score again</text>
<line x1="50" y1="316" x2="1150" y2="316" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="50" y="342" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">WHO</text>
<rect x="130" y="330" width="29" height="16" rx="4" fill="#ececec"/>
<text x="144.5" y="342" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="170" y="342" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">a step you do or approve</text>
<rect x="640" y="330" width="24" height="16" rx="4" fill="#ececec"/>
<text x="652.0" y="342" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">AI</text>
<text x="676" y="342" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">a step your AI agent drafts for you</text>
<text x="50" y="368" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">FLOW</text>
<line x1="130" y1="364" x2="160" y2="364" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<text x="170" y="368" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">next step</text>
<line x1="640" y1="364" x2="670" y2="364" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
<text x="680" y="368" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">goes back to an earlier step</text>
</svg>
