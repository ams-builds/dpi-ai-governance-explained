<svg viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">How the kit works, at a glance</title>
<desc id="desc">Six steps: you describe your AI app, Claude lists the risks and scores each one, you confirm the risk tier, Claude drafts the controls that the tier needs, and you keep the evidence. After an incident or a big change, you score again.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/></marker>
  <marker id="arrowMuted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#7a8399"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="380" fill="#f5f5f5"/>
<text x="40" y="44" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" fill="#2d3142">How the kit works, at a glance</text>
<text x="40" y="64" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">FIND THE RISK. GET THE CONTROLS. KEEP THE PROOF.</text>
<rect x="40" y="110" width="150" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="46" y="116" width="29" height="16" rx="4" fill="#ececec"/>
<text x="60.5" y="128" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="115.0" y="146.0" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Your AI app</text>
<text x="115.0" y="160.0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">what it decides</text>
<line x1="190" y1="140" x2="226" y2="140" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="230" y="110" width="150" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="236" y="116" width="24" height="16" rx="4" fill="#ececec"/>
<text x="248.0" y="128" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">AI</text>
<text x="305.0" y="146.0" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">List risks</text>
<text x="305.0" y="160.0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">what can go wrong</text>
<line x1="380" y1="140" x2="416" y2="140" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="420" y="110" width="150" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="426" y="116" width="24" height="16" rx="4" fill="#ececec"/>
<text x="438.0" y="128" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">AI</text>
<text x="495.0" y="146.0" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Score each</text>
<text x="495.0" y="160.0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">likelihood × impact</text>
<line x1="570" y1="140" x2="606" y2="140" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="610" y="110" width="150" height="60" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="616" y="116" width="29" height="16" rx="4" fill="#ececec"/>
<text x="630.5" y="128" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="685.0" y="146.0" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Find the tier</text>
<text x="685.0" y="160.0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">Tier 0 to Tier 3</text>
<line x1="760" y1="140" x2="796" y2="140" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="800" y="110" width="150" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="806" y="116" width="24" height="16" rx="4" fill="#ececec"/>
<text x="818.0" y="128" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">AI</text>
<text x="875.0" y="146.0" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Add controls</text>
<text x="875.0" y="160.0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">what the tier needs</text>
<line x1="950" y1="140" x2="986" y2="140" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="990" y="110" width="150" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="996" y="116" width="29" height="16" rx="4" fill="#ececec"/>
<text x="1010.5" y="128" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="1065.0" y="146.0" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Keep evidence</text>
<text x="1065.0" y="160.0" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" fill="#4f5d75">proof for review</text>
<path d="M1065,170 C1065,260 305,260 305,174" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
<text x="685" y="262" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" letter-spacing="0.06em" fill="#7a8399">after an incident or a big change: score again</text>
<line x1="40" y1="290" x2="1160" y2="290" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
<text x="40" y="316" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">WHO</text>
<rect x="120" y="304" width="29" height="16" rx="4" fill="#ececec"/>
<text x="134.5" y="316" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">YOU</text>
<text x="160" y="316" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">a step you do or approve</text>
<rect x="340" y="304" width="24" height="16" rx="4" fill="#ececec"/>
<text x="352.0" y="316" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="600" fill="#2d3142">AI</text>
<text x="376" y="316" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">a step Claude drafts for you</text>
<text x="40" y="346" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" font-weight="600" letter-spacing="0.1em" fill="#7a8399">FLOW</text>
<line x1="120" y1="342" x2="150" y2="342" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<text x="160" y="346" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">next step</text>
<line x1="340" y1="342" x2="370" y2="342" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
<text x="380" y="346" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#2d3142">goes back to an earlier step</text>
</svg>
